# Render blueprint for the Everrealm world server (accounts, characters, other players).
# New > Blueprint on render.com, pick this repository, and Render builds and runs it.
# The free plan sleeps when idle and forgets its files on every restart. To keep accounts and
# characters anyway, fill in the two Upstash Redis values (a free database at upstash.com): the
# server mirrors every write there and restores from it on start. Or use the Starter plan with the
# disk below.
services:
  - type: web
    name: everrealm-realm
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # AI-voiced townsfolk (server/npc.mjs). Leave the key empty and the feature stays off.
      # The key is set in Render's dashboard only, never in this file or the browser.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Which Claude model voices them: claude-haiku-5-5 (about 0.03 cents a reply) or
      # claude-opus-5-5 (about 1 cent a reply, better writing). Empty means claude-opus-5-5.
      - key: NPC_MODEL
        sync: false
      # Most the realm spends on them in a day, in US dollars, counted from the tokens used
      - key: NPC_DAILY_USD
        value: "1"
      # With the disk below, also keep the realm's files on it:
      # - key: EVERREALM_DATA
      #   value: /var/data/everrealm
    # disk:
    #   name: realm-data
    #   mountPath: /var/data
    #   sizeGB: 1
