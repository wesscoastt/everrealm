# Builds the game and publishes it to GitHub Pages on every push to main.
# Set the repository variable VITE_REALM (Settings > Secrets and variables > Actions > Variables)
# to the world server's address, e.g. wss://everrealm-realm.onrender.com, and the hosted game
# connects to it by default. Without it the hosted game plays offline in the browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sites
      - run: npm run build
        env:
          # Served at the root of its own domain, everrealm.quest (set in Settings > Pages)
          BASE_PATH: /
          VITE_REALM: ${{ vars.VITE_REALM }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
